[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "language-parser-interpreter"
version = "1.0.0"
description = "A small interpreted language with a lexer, recursive-descent parser, AST, and execution engine."
requires-python = ">=3.10"

[project.scripts]
minilang = "minilang.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
